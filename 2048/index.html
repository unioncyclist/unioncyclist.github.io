<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="一个支持撤销操作的 2048 网页小游戏。"
    />
    <title>2048 - Union Cyclist</title>
    <style>
      :root {
        --page: #faf8ef;
        --ink: #776e65;
        --muted: #9a9188;
        --board: #bbada0;
        --empty: rgb(238 228 218 / 35%);
        --accent: #8f7a66;
        --light: #f9f6f2;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        margin: 0;
        color: var(--ink);
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
          sans-serif;
        background:
          radial-gradient(circle at top, #fffdf7 0, transparent 28rem),
          var(--page);
      }

      button {
        border: 0;
        font: inherit;
        cursor: pointer;
      }

      .game {
        width: min(100% - 2rem, 31rem);
        margin: 0 auto;
        padding: 2rem 0 3rem;
      }

      .topbar,
      .intro,
      .controls,
      .score-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 1rem;
      }

      h1 {
        margin: 0;
        color: #776e65;
        font-size: clamp(3.4rem, 18vw, 5.2rem);
        line-height: 0.9;
        letter-spacing: -0.08em;
      }

      .score-row {
        align-items: stretch;
      }

      .score {
        position: relative;
        min-width: 6.2rem;
        padding: 0.45rem 0.85rem;
        border-radius: 0.25rem;
        color: #eee4da;
        text-align: center;
        background: #bbada0;
      }

      .score-label {
        display: block;
        color: #eee4da;
        font-size: 0.7rem;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      .score-value {
        display: block;
        color: #fff;
        font-size: 1.35rem;
        font-weight: 800;
        line-height: 1.2;
      }

      .score-pop {
        position: absolute;
        top: 0.1rem;
        right: 0.7rem;
        color: rgb(119 110 101 / 90%);
        font-size: 1rem;
        font-weight: 800;
        pointer-events: none;
        animation: score-pop 0.6s ease-in forwards;
      }

      @keyframes score-pop {
        from {
          opacity: 1;
          transform: translateY(0);
        }
        to {
          opacity: 0;
          transform: translateY(-2rem);
        }
      }

      .intro {
        align-items: flex-start;
        margin: 1rem 0;
        font-size: 0.98rem;
        line-height: 1.45;
      }

      .intro-actions {
        display: flex;
        flex: 0 0 auto;
        gap: 0.55rem;
      }

      .intro p {
        margin: 0;
      }

      .intro strong {
        color: #5f554c;
      }

      .button {
        flex: 0 0 auto;
        padding: 0.7rem 1rem;
        border-radius: 0.25rem;
        color: #f9f6f2;
        font-weight: 700;
        background: var(--accent);
        transition: transform 0.15s ease, background 0.15s ease;
      }

      .button:not(:disabled):hover,
      .button:not(:disabled):focus-visible {
        background: #7b6856;
        transform: translateY(-1px);
      }

      .button:disabled {
        cursor: not-allowed;
        opacity: 0.55;
      }

      .button:focus-visible,
      .help-button:focus-visible {
        outline: 3px solid #4c9ffe;
        outline-offset: 3px;
      }

      .controls {
        justify-content: flex-start;
        margin-bottom: 0.8rem;
      }

      .undo-button {
        min-width: 5.4rem;
      }

      .board-wrap {
        position: relative;
      }

      .board {
        --board-gap: clamp(0.45rem, 2vw, 0.8rem);
        --board-pad: clamp(0.45rem, 2vw, 0.8rem);
        position: relative;
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: var(--board-gap);
        padding: var(--board-pad);
        border-radius: 0.5rem;
        background: var(--board);
        touch-action: none;
      }

      .cell-layer,
      .tile-layer {
        display: grid;
        position: absolute;
        inset: var(--board-pad);
        grid-template-columns: repeat(4, 1fr);
        gap: var(--board-gap);
      }

      .cell-layer {
        position: relative;
        inset: auto;
        grid-column: 1 / -1;
        grid-row: 1 / -1;
      }

      .cell {
        aspect-ratio: 1;
        border-radius: 0.25rem;
        background: var(--empty);
      }

      .tile-layer {
        pointer-events: none;
      }

      .tile {
        display: grid;
        position: relative;
        aspect-ratio: 1;
        place-items: center;
        border-radius: 0.25rem;
        color: var(--ink);
        font-size: clamp(1.6rem, 10vw, 3.25rem);
        font-weight: 800;
        line-height: 1;
        background: var(--empty);
        user-select: none;
      }

      .tile.spawn {
        animation: tile-spawn 0.18s ease-out;
      }

      .tile.move {
        z-index: 2;
        transition: transform 0.1s ease-in-out;
      }

      .tile.merge {
        z-index: 3;
        animation: tile-pop 0.2s ease-in-out 0.1s both;
      }

      @keyframes tile-spawn {
        0% {
          opacity: 0;
          transform: scale(0);
        }
        75% {
          transform: scale(1.12);
        }
        100% {
          opacity: 1;
          transform: scale(1);
        }
      }

      @keyframes tile-merge {
        0%,
        100% {
          transform: scale(1);
        }
        45% {
          transform: scale(1.14);
        }
      }

      @keyframes tile-pop {
      0% {
        transform: scale(0);
      }
      50% {
        transform: scale(1.2);
      }
      100% {
        transform: scale(1);
      }

      @media (prefers-reduced-motion: reduce) {
        .score-pop,
        .tile.spawn,
        .tile.merge {
          animation: none;
        }
        .tile.move {
          transition: none;
        }
      }

      .tile[data-value="2"] { background: #eee4da; }
      .tile[data-value="4"] { background: #ede0c8; }
      .tile[data-value="8"] { color: #f9f6f2; background: #f2b179; }
      .tile[data-value="16"] { color: #f9f6f2; background: #f59563; }
      .tile[data-value="32"] { color: #f9f6f2; background: #f67c5f; }
      .tile[data-value="64"] { color: #f9f6f2; background: #f65e3b; }
      .tile[data-value="128"] { color: #f9f6f2; background: #edcf72; }
      .tile[data-value="256"] { color: #f9f6f2; background: #edcc61; }
      .tile[data-value="512"] { color: #f9f6f2; background: #edc850; }
      .tile[data-value="1024"] { color: #f9f6f2; background: #edc53f; }
      .tile[data-value="2048"] { color: #f9f6f2; background: #edc22e; }
      .tile[data-value="super"] { color: #f9f6f2; background: #3c3a32; }

      .status {
        min-height: 2rem;
        margin: 1rem 0 0;
        color: var(--muted);
        text-align: center;
      }

      .status strong {
        color: var(--accent);
      }

      .help-button {
        padding: 0;
        color: var(--muted);
        background: transparent;
        text-decoration: underline;
        text-underline-offset: 0.2em;
      }

      .modal {
        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
        padding: 1.5rem;
        border-radius: 0.5rem;
        background: rgb(250 248 239 / 88%);
      }

      .modal[hidden] {
        display: none;
      }

      .modal-card {
        max-width: 22rem;
        padding: 1.8rem;
        border-radius: 0.5rem;
        text-align: center;
        background: #fff;
        box-shadow: 0 0.8rem 2rem rgb(119 110 101 / 18%);
      }

      .modal-card h2 {
        margin: 0 0 0.5rem;
        color: #776e65;
        font-size: 2rem;
      }

      .modal-card p {
        margin: 0 0 1.2rem;
      }

      .modal-actions {
        display: flex;
        justify-content: center;
        gap: 0.7rem;
        flex-wrap: wrap;
      }

      .secondary-button {
        color: var(--accent);
        background: #eee4da;
      }

      @media (max-width: 420px) {
        .game {
          padding-top: 1rem;
        }

        .intro {
          display: block;
        }

        .intro-actions {
          margin-top: 0.8rem;
        }
      }
    </style>
  </head>
  <body>
    <main class="game">
      <header class="topbar">
        <h1>2048</h1>
        <div class="score-row" aria-label="游戏分数">
          <div class="score">
            <span class="score-label">分数</span>
            <span class="score-value" id="score">0</span>
          </div>
          <div class="score">
            <span class="score-label">最高分</span>
            <span class="score-value" id="best-score">0</span>
          </div>
        </div>
      </header>

      <div class="intro">
        <p>合并数字，得到 <strong>2048</strong>！达到 2048 后仍可继续挑战更高分。</p>
        <div class="intro-actions">
          <button class="button" id="new-game" type="button">新游戏</button>
          <button class="button undo-button" id="undo" type="button" disabled>上一步</button>
        </div>
      </div>

      <div class="controls">
        <button class="help-button" id="help" type="button">玩法说明</button>
      </div>

      <section class="board-wrap" aria-label="2048 游戏棋盘">
        <div class="board" id="board" role="grid" aria-label="4乘4棋盘">
          <div class="cell-layer" aria-hidden="true"></div>
          <div class="tile-layer" id="tile-layer"></div>
        </div>
        <div class="modal" id="modal" hidden>
          <div class="modal-card">
            <h2 id="modal-title">你赢了！</h2>
            <p id="modal-message">成功合成 2048。要继续挑战更高分吗？</p>
            <div class="modal-actions">
              <button class="button" id="continue-game" type="button">继续游戏</button>
              <button class="button secondary-button" id="restart-game" type="button">重新开始</button>
            </div>
          </div>
        </div>
      </section>

      <p class="status" id="status" aria-live="polite">使用方向键、WASD 或滑动移动；按 U 可撤销上一步。</p>
    </main>

    <script>
      (() => {
        const SIZE = 4;
        const TARGET = 2048;
        const BEST_SCORE_KEY = "unioncyclist-2048-best";
        const boardElement = document.querySelector("#board");
        const tileLayerElement = document.querySelector("#tile-layer");
        const scoreElement = document.querySelector("#score");
        const bestScoreElement = document.querySelector("#best-score");
        const undoButton = document.querySelector("#undo");
        const modal = document.querySelector("#modal");
        const modalTitle = document.querySelector("#modal-title");
        const modalMessage = document.querySelector("#modal-message");
        const statusElement = document.querySelector("#status");
        const state = {
          board: [],
          score: 0,
          bestScore: Number(localStorage.getItem(BEST_SCORE_KEY)) || 0,
          history: [],
          animation: null,
          won: false,
          gameOver: false,
        };

        const emptyBoard = () =>
          Array.from({ length: SIZE }, () => Array(SIZE).fill(0));

        const cloneBoard = (board) => board.map((row) => [...row]);

        const randomEmptyCell = (board) => {
          const cells = [];
          board.forEach((row, rowIndex) => {
            row.forEach((value, columnIndex) => {
              if (!value) cells.push([rowIndex, columnIndex]);
            });
          });
          return cells[Math.floor(Math.random() * cells.length)];
        };

        const addRandomTile = (board) => {
          const cell = randomEmptyCell(board);
          if (cell) {
            const [row, column] = cell;
            board[row][column] = Math.random() < 0.9 ? 2 : 4;
          }
          return cell;
        };

        const saveBestScore = () => {
          if (state.score > state.bestScore) {
            state.bestScore = state.score;
            localStorage.setItem(BEST_SCORE_KEY, String(state.bestScore));
          }
        };

        const updateStatus = (message) => {
          statusElement.textContent = message;
        };

        const createTile = (value, classes, position) => {
          const tile = document.createElement("div");
          tile.className = ["tile", classes].filter(Boolean).join(" ");
          tile.style.gridRow = position[0] + 1;
          tile.style.gridColumn = position[1] + 1;
          tile.dataset.value = value > 2048 ? "super" : String(value);
          tile.textContent = value || "";
          tile.setAttribute("role", "gridcell");
          tile.setAttribute("aria-label", value ? `${value}` : "空");
          return tile;
        };

        const renderCells = () => {
          const cellLayer = boardElement.querySelector(".cell-layer");
          cellLayer.replaceChildren();
          for (let index = 0; index < SIZE * SIZE; index += 1) {
            const cell = document.createElement("div");
            cell.className = "cell";
            cellLayer.append(cell);
          }
        };

        const render = () => {
          tileLayerElement.replaceChildren();
          if (state.animation?.scoreGain) {
            const addition = document.createElement("span");
            addition.className = "score-pop";
            addition.textContent = `+${state.animation.scoreGain}`;
            scoreElement.parentElement.append(addition);
            window.setTimeout(() => addition.remove(), 650);
          }
          const animation = state.animation;
          if (animation?.actors) {
            animation.actors.forEach((actor) => {
              const tile = createTile(
                actor.value,
                [actor.move && "move", actor.merge && "merge", actor.spawn && "spawn"]
                  .filter(Boolean)
                  .join(" "),
                actor.to
              );
              if (actor.move) {
                tile.style.transform = `translate(${actor.from[1] - actor.to[1]}00%, ${actor.from[0] - actor.to[0]}00%)`;
                window.requestAnimationFrame(() => {
                  tile.style.transform = "translate(0, 0)";
                });
              }
              tileLayerElement.append(tile);
            });
          } else {
            state.board.forEach((row, rowIndex) => row.forEach((value, columnIndex) => {
              if (value) tileLayerElement.append(createTile(value, "", [rowIndex, columnIndex]));
            }));
          });
          if (animation?.actors) {
            window.setTimeout(() => {
              if (state.animation === animation) {
                state.animation = null;
                render();
              }
            }, 260);
          }
          scoreElement.textContent = state.score;
          bestScoreElement.textContent = state.bestScore;
          undoButton.disabled = state.history.length === 0;
        };

        const slideRow = (row) => {
          const compact = row.filter((tile) => tile.value);
          const result = [];
          let gained = 0;
          for (let index = 0; index < compact.length; index += 1) {
            if (compact[index].value === compact[index + 1]?.value) {
              const merged = compact[index].value * 2;
              result.push({
                value: merged,
                sources: [compact[index], compact[index + 1]],
                merge: true,
              });
              gained += merged;
              index += 1;
            } else {
              result.push({
                value: compact[index].value,
                sources: [compact[index]],
                merge: false,
              });
            }
          }
          while (result.length < SIZE) result.push(null);
          return {
            row: result.map((tile) => tile?.value || 0),
            items: result,
            gained,
          };
        };

        const move = (direction) => {
          const before = JSON.stringify(state.board);
          const next = emptyBoard();
          const actors = [];
          let gained = 0;
          for (let index = 0; index < SIZE; index += 1) {
            let source;
            if (direction === "left" || direction === "right") {
              source = state.board[index].map((value, column) => ({
                value,
                index: column,
              }));
              if (direction === "right") source.reverse();
              const result = slideRow(source);
              if (direction === "right") {
                result.row.reverse();
                result.items.reverse();
              }
              next[index] = result.row;
              result.items.forEach((tile, column) => {
                if (!tile) return;
                const to = [index, column];
                tile.sources.forEach((source) => actors.push({
                  value: source.value,
                  from: [index, source.index],
                  to,
                  move: true,
                }));
                if (tile.merge) actors.push({
                  value: tile.value,
                  from: to,
                  to,
                  merge: true,
                });
              });
              gained += result.gained;
            } else {
              source = state.board.map((row, rowIndex) => ({
                value: row[index],
                index: rowIndex,
              }));
              if (direction === "down") source.reverse();
              const result = slideRow(source);
              if (direction === "down") {
                result.row.reverse();
                result.items.reverse();
              }
              result.row.forEach((value, rowIndex) => {
                next[rowIndex][index] = value;
              });
              result.items.forEach((tile, row) => {
                if (!tile) return;
                const to = [row, index];
                tile.sources.forEach((source) => actors.push({
                  value: source.value,
                  from: [source.index, index],
                  to,
                  move: true,
                }));
                if (tile.merge) actors.push({
                  value: tile.value,
                  from: to,
                  to,
                  merge: true,
                });
              });
              gained += result.gained;
            }
          }
          if (JSON.stringify(next) === before) return false;
          state.history.push({
            board: cloneBoard(state.board),
            score: state.score,
            won: state.won,
            gameOver: state.gameOver,
          });
          state.board = next;
          state.score += gained;
          saveBestScore();
          const spawn = addRandomTile(state.board);
          if (spawn) {
            actors.push({
              value: state.board[spawn[0]][spawn[1]],
              from: spawn,
              to: spawn,
              spawn: true,
            });
          }
          state.animation = {
            actors,
            scoreGain: gained,
          };
          if (!state.won && state.board.flat().includes(TARGET)) showWinModal();
          if (!hasMoves(state.board)) {
            state.gameOver = true;
            showGameOverModal();
          }
          render();
          return true;
        };

        const hasMoves = (board) => {
          if (board.flat().some((value) => value === 0)) return true;
          for (let row = 0; row < SIZE; row += 1) {
            for (let column = 0; column < SIZE; column += 1) {
              if (
                board[row][column] === board[row + 1]?.[column] ||
                board[row][column] === board[row][column + 1]
              ) return true;
            }
          }
          return false;
        };

        const hideModal = () => {
          modal.hidden = true;
        };

        const showWinModal = () => {
          state.won = true;
          modalTitle.textContent = "你赢了！";
          modalMessage.textContent = "成功合成 2048。继续游戏，挑战更高分吧！";
          document.querySelector("#continue-game").hidden = false;
          modal.hidden = false;
        };

        const showGameOverModal = () => {
          modalTitle.textContent = "游戏结束";
          modalMessage.textContent = "棋盘已没有可移动的方块，再来一局吧。";
          document.querySelector("#continue-game").hidden = true;
          modal.hidden = false;
        };

        const newGame = () => {
          state.board = emptyBoard();
          state.score = 0;
          state.history = [];
          state.animation = null;
          state.won = false;
          state.gameOver = false;
          hideModal();
          addRandomTile(state.board);
          addRandomTile(state.board);
          updateStatus("使用方向键、WASD 或滑动移动；按 U 可撤销上一步。");
          renderCells();
          render();
        };

        const undo = () => {
          if (state.history.length === 0) return;
          const previous = state.history.pop();
          state.board = previous.board;
          state.score = previous.score;
          state.won = previous.won;
          state.gameOver = previous.gameOver;
          state.animation = null;
          hideModal();
          updateStatus(
            state.history.length > 0
              ? `已撤销一步，还可以继续撤销 ${state.history.length} 步。`
              : "已撤销到最初状态。"
          );
          render();
        };

        const keyDirections = {
          ArrowLeft: "left",
          ArrowRight: "right",
          ArrowUp: "up",
          ArrowDown: "down",
          a: "left",
          d: "right",
          w: "up",
          s: "down",
        };

        document.addEventListener("keydown", (event) => {
          if (event.key.toLowerCase() === "u") {
            event.preventDefault();
            undo();
            return;
          }
          const direction = keyDirections[event.key];
          if (!direction || state.gameOver) return;
          event.preventDefault();
          move(direction);
        });

        let touchStart = null;
        boardElement.addEventListener("touchstart", (event) => {
          const [touch] = event.changedTouches;
          touchStart = { x: touch.clientX, y: touch.clientY };
        }, { passive: true });
        boardElement.addEventListener("touchend", (event) => {
          if (!touchStart || state.gameOver) return;
          const [touch] = event.changedTouches;
          const deltaX = touch.clientX - touchStart.x;
          const deltaY = touch.clientY - touchStart.y;
          touchStart = null;
          if (Math.max(Math.abs(deltaX), Math.abs(deltaY)) < 24) return;
          const direction = Math.abs(deltaX) > Math.abs(deltaY)
            ? (deltaX > 0 ? "right" : "left")
            : (deltaY > 0 ? "down" : "up");
          move(direction);
        }, { passive: true });

        document.querySelector("#new-game").addEventListener("click", newGame);
        document.querySelector("#restart-game").addEventListener("click", newGame);
        document.querySelector("#continue-game").addEventListener("click", () => {
          hideModal();
          updateStatus("继续挑战更高分！");
        });
        undoButton.addEventListener("click", undo);
        document.querySelector("#help").addEventListener("click", () => {
          updateStatus("方向键/WASD/滑动移动；相同数字会合并；按 U 或点击“上一步”可连续撤销。");
        });

        newGame();
      })();
    </script>
  </body>
</html>
